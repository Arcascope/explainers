<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arcascope Explainers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f7f6f2;
    --bg-soft:#ffffff;
    --ink:#1b1e24;
    --ink-dim:#4b5563;
    --ink-faint:#98a1af;
    --line:#e5e7eb;
    --accent:#e07b00;
    --maxw:820px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
  header{padding:14vh 0 7vh}
  .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:20px;font-weight:600}
  h1{font-weight:800;font-size:clamp(38px,6.5vw,64px);line-height:1.04;letter-spacing:-.025em;margin:0 0 20px}
  header p{color:var(--ink-dim);max-width:34em;margin:0}
  main{padding-bottom:16vh}
  .card{
    display:block;border:1px solid var(--line);border-radius:14px;
    padding:26px 28px;margin-bottom:18px;text-decoration:none;color:inherit;
    background:var(--bg-soft);transition:border-color .15s ease,transform .15s ease;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 14px rgba(16,24,40,.06)}
  .card h2{font-weight:700;font-size:26px;margin:0 0 8px;letter-spacing:-.015em}
  .card h2 .arrow{color:var(--accent);font-weight:400}
  .card p{margin:0;color:var(--ink-dim);font-size:16px}
  footer{border-top:1px solid var(--line);padding:28px 0;color:var(--ink-faint);font-size:14px}
  footer a{color:var(--ink-dim);text-decoration:none}
  footer a:hover{color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">Arcascope</div>
    <h1>Explainers</h1>
    <p>Interactive companions to our papers and research.</p>
  </div>
</header>
<main>
  <div class="wrap">
    <a class="card" href="etc/">
      <h2>Easy-to-classify wake <span class="arrow">&rarr;</span></h2>
      <p>Why a sleep classifier can look great without being good: an interactive on how easy-to-classify wake inflates AUROC, and what to do about it.</p>
    </a>
  </div>
</main>
<footer>
  <div class="wrap"><a href="https://arcascope.com">arcascope.com</a> &middot; <a href="https://github.com/Arcascope/explainers">source</a></div>
</footer>
</body>
</html>
